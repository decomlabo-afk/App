<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Je serai millionnaire</title>
  <meta name="description" content="Oui, je serai millionnaire. C'est une certitude : 1 €." />
  <meta name="theme-color" content="#0b0b0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Millionnaire" />
  <meta property="og:title" content="Oui, je serai millionnaire." />
  <meta property="og:description" content="C'est une certitude. 1 €." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="page">
    <h1 class="statement">Oui, je serai<br /><span class="gold">millionnaire.</span></h1>

    <button id="pay" class="cta" type="button">
      <span class="cta-label">C'est une certitude</span>
      <span class="cta-price">1&nbsp;€</span>
    </button>

    <p class="methods" aria-label="Moyens de paiement acceptés">
      <span>Apple&nbsp;Pay</span><span aria-hidden="true">·</span>
      <span>Google&nbsp;Pay</span><span aria-hidden="true">·</span>
      <span>Carte bancaire</span>
    </p>

    <p id="counter" class="counter" hidden></p>
    <p id="error" class="error" role="alert" hidden></p>
  </main>

  <footer class="footer">Paiement sécurisé par Stripe</footer>

  <script src="/app.js"></script>
</body>
</html>
